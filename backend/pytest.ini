[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# /app is owned by the build user and read-only to the runtime user
# (uid 10001) — point the cache at /tmp so in-container test runs work.
cache_dir = /tmp/.pytest_cache

# Run unit tests by default. Integration tests need a running stack
# (postgres, backend, OpenRouter key) and are kept out of CI:
#   pytest                       -> unit only
#   pytest -m integration        -> integration only
#   pytest -m ""                 -> everything
addopts = -m "not integration" -ra

markers =
    integration: needs the full docker compose stack and a real OpenRouter key
