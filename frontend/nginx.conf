# nginx config for the frontend container.
# Serves static files and proxies /api/* to the backend on the docker network.

# Most endpoints take small JSON. The admin upload endpoint takes a file —
# the backend caps that at 20 MB; allow nginx to forward up to 22 MB so a
# slightly-over upload reaches the backend's typed error rather than
# nginx's bare 413.
client_max_body_size 22m;

# Hide nginx version from Server header. Defense in depth, not a real secret.
server_tokens off;

# Slowloris / slow-body / slow-read defense. nginx defaults are quite
# generous (60s+) which lets a single client hold many workers open
# while trickling bytes (audit C2-MED-2, 2026-05-12).
# `keepalive_timeout` is already set at http-level by the base image's
# /etc/nginx/nginx.conf; re-declaring it here would be a duplicate,
# so it's set inside `server { ... }` below instead. The other
# timeouts are NOT in the base config and are safe at http-level.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          30s;

# Limit concurrent connections per source IP. SSE chat holds one
# long-poll per active chat turn, so the cap has to accommodate
# real usage — 30 covers a single user with multiple tabs without
# letting one abuser exhaust the worker pool.
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Trust X-Forwarded-For only when it arrives from inside our docker bridge.
# Combined with the loopback-only port binding in docker-compose.yml (the
# only path in is Caddy → 127.0.0.1:8080 → docker NAT → this nginx), this
# means: nginx ignores any XFF on direct connections from public IPs and
# replaces $remote_addr with Caddy's authoritative client IP. Without
# this block, $proxy_add_x_forwarded_for would prepend an attacker-
# controlled value, defeating the per-IP rate limiter (audit C2-HIGH-1).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    # Cap concurrent open connections per client IP (audit C2-MED-2).
    limit_conn perip 30;
    # Overrides the base image's 65s http-level default. Inside the
    # server-block it's a redeclaration, not a duplicate.
    keepalive_timeout 30s 30s;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe consumed by docker healthcheck. No security headers
    # needed — kept under a separate location so nothing else inherits its
    # add_header semantics.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend API. The backend service is reachable on the internal docker
    # network as `backend:8000`; the host has no published port for it.
    # The FastAPI middleware adds CSP and other security headers for /api/*
    # responses, so we deliberately do not inject them at this layer.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tight body cap for JSON endpoints — only the document upload
        # path (which routes through a different sub-location below)
        # legitimately needs the 22 MB ceiling. Login/chat/etc. accept
        # at most a few KB; raising the cap here defeats the defense
        # against multi-MB JSON floods (audit C1-MED-2 / C2-MED-6).
        client_max_body_size 64k;

        # SSE / streaming: disable buffering so chat tokens arrive promptly.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The admin document-upload endpoint is the one place a real client
    # legitimately POSTs many MB. Scoped allowance so it doesn't bleed
    # into every JSON route.
    location = /api/admin/documents {
        proxy_pass http://backend:8000/api/admin/documents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 22m;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets. Aggressive caching is fine — there is no service worker
    # and filenames change on each redeploy of the container image.
    # Security headers must be repeated in every location because nginx's
    # add_header inheritance drops server-level headers as soon as ANY
    # location-level add_header is present.
    location / {
        # $uri.html lets us serve clean URLs (/impressum → impressum.html)
        # without exposing the .html suffix. Order matters: $uri first so an
        # existing file at the exact name still wins, then $uri.html for
        # static legal pages, then SPA fallback to index.html.
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # CSP kept in lockstep with backend/main.py SecurityHeadersMiddleware
        # (audit C2-MED-4, 2026-05-12). Any change here MUST be mirrored
        # there or the static-file paths will drift from the API paths.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'; report-uri /api/csp-report" always;
    }

    # Hide common probe paths quickly.
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; return 200 "User-agent: *\nDisallow: /\n"; }

    # security.txt — RFC 9116 / disclosure contact for security researchers
    # (audit I-4, 2026-05-10). Operators must edit /usr/share/nginx/html/.well-known/security.txt
    # before going live; the shipped file is a placeholder with [BRACKETS]
    # the operator MUST replace.
    location = /.well-known/security.txt {
        access_log off;
        try_files $uri =404;
    }
}
